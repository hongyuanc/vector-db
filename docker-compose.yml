version: '3.8'

services:
  vector-db:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - vector-data:/data
      - ./src:/app/src  # Mount source for development
    environment:
      - VECTOR_DB_DATA_DIR=/data
      - LOG_LEVEL=info
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  vector-data:
    driver: local
